apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: alb-controller
  namespace: cluster-config
spec:
  type: oci
  interval: 1h
  url: oci://mcr.microsoft.com/application-lb/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alb-controller
  namespace: cluster-config
spec:
  interval: 30m
  releaseName: alb-controller
  targetNamespace: azure-alb-system
  chart:
    spec:
      chart: alb-controller
      # Pin exactly. Renovate/Dependabot bumps this via PR, never "latest".
      version: "1.12.4"
      sourceRef:
        kind: HelmRepository
        name: alb-controller
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    albController:
      namespace: azure-alb-system
      podIdentity:
        # Injected by Terraform through Flux post-build substitution.
        clientID: "${ALB_CLIENT_ID}"
    # Gateway API CRDs are installed by the controller's init container.
    # Set false only if another component (e.g. AKS managed Gateway API) owns them.
    installGatewayApiCRDs: true
    # Enables the WebApplicationFirewallPolicy CRD.
    securityPolicyFeatureFlag: true
