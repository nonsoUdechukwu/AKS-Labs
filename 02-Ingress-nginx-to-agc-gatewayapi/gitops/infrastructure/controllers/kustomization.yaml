apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The AKS microsoft.flux extension runs Flux in multi-tenant mode:
# sources and HelmReleases must live in the flux configuration namespace
# (cluster-config) and use targetNamespace to land workloads elsewhere.
resources:
  - namespaces.yaml
  - alb-controller.yaml
  - cert-manager.yaml
