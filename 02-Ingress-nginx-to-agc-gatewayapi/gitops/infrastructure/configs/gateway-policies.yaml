# TLS 1.2+ with strong ciphers only on the HTTPS listener.
apiVersion: alb.networking.azure.io/v1
kind: FrontendTLSPolicy
metadata:
  name: shared-public-tls
  namespace: ingress-gateways
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: shared-public
    namespace: ingress-gateways
    sectionNames:
      - https
  default:
    policyType:
      type: predefined
      name: 2023-06-S
---
# Baseline WAF for every route on the shared HTTPS listener.
# Teams can attach a stricter policy to their own HTTPRoute.
apiVersion: alb.networking.azure.io/v1
kind: WebApplicationFirewallPolicy
metadata:
  name: shared-public-waf
  namespace: ingress-gateways
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: shared-public
    namespace: ingress-gateways
    sectionNames:
      - https
  webApplicationFirewall:
    id: "${WAF_POLICY_ID}"
