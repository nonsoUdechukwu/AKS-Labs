apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-v1
  labels: {app.kubernetes.io/name: web, app.kubernetes.io/version: v1}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: web, app.kubernetes.io/version: v1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: web, app.kubernetes.io/version: v1}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: app
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          command: ["./podinfo", "--port=9898", "--level=info"]
          env:
            - {name: PODINFO_UI_MESSAGE, value: "shop web v1"}
          ports:
            - {name: http, containerPort: 9898}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: web-v1
spec:
  selector: {app.kubernetes.io/name: web, app.kubernetes.io/version: v1}
  ports:
    - {name: http, port: 80, targetPort: http}
---
