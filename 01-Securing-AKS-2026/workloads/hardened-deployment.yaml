# A workload that passes Pod Security "restricted", runs in its own user namespace
# and uses the runtime's default AppArmor and seccomp profiles.
# Schedule it on Azure Linux 3.0 or Ubuntu 24.04 nodes (user namespace support).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkout
  namespace: payments
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: payments
  labels:
    app.kubernetes.io/name: checkout
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
    spec:
      serviceAccountName: checkout
      automountServiceAccountToken: false
      # GA in 1.36: container UID 0..65535 maps to an unprivileged host range.
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        # Field form (1.30+) replaces the old container.apparmor.security.beta.kubernetes.io annotation.
        appArmorProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Pin by digest in real deployments, and verify the signature at admission.
          image: ghcr.io/stefanprodan/podinfo:6.9.2
          ports:
            - name: http
              containerPort: 9898
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
