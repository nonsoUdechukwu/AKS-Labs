# MutatingAdmissionPolicy is GA in Kubernetes 1.36: in-process CEL mutation, no webhook
# Deployment, no TLS certificates, no fail-open/fail-closed availability trade-off.
# It fills in secure defaults that teams forget, before Pod Security Admission runs:
#   * automountServiceAccountToken: false (opt back in by setting it explicitly)
#   * pod-level seccompProfile RuntimeDefault
# Values a team sets explicitly are never overwritten.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: pod-secure-defaults
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          (has(object.spec.automountServiceAccountToken) ? [] : [
            JSONPatch{op: "add", path: "/spec/automountServiceAccountToken", value: false}
          ]) +
          (!has(object.spec.securityContext) ? [
            JSONPatch{op: "add", path: "/spec/securityContext",
              value: Object.spec.securityContext{seccompProfile: Object.spec.securityContext.seccompProfile{type: "RuntimeDefault"}}}
          ] : !has(object.spec.securityContext.seccompProfile) ? [
            JSONPatch{op: "add", path: "/spec/securityContext/seccompProfile",
              value: Object.spec.securityContext.seccompProfile{type: "RuntimeDefault"}}
          ] : [])
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: pod-secure-defaults
spec:
  policyName: pod-secure-defaults
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public", "kube-node-lease", "gatekeeper-system", "platform-system"]
