# Service externalIPs let anyone who can create a Service intercept traffic to an
# arbitrary IP (CVE-2020-8554). The field is deprecated upstream as of 1.36; AKS
# Automatic already blocks it. This closes the gap on AKS Standard.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deny-service-externalips
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  validations:
    - expression: "!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
      message: "Service.spec.externalIPs is not allowed (CVE-2020-8554). Use a LoadBalancer Service or Gateway API."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: deny-service-externalips
spec:
  policyName: deny-service-externalips
  validationActions: ["Deny"]
