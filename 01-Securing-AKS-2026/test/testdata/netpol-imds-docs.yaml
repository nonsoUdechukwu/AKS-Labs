# Sample from Microsoft Learn "Best practices for cluster security" (as of Oct 2026).
# 10.10.0.0/0 is the same range as 0.0.0.0/0, so the except clause does the work,
# but Kubernetes 1.36+ rejects the non-canonical prefix (StrictIPCIDRValidation beta).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-instance-metadata
spec:
  podSelector:
    matchLabels: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.10.0.0/0
            except:
              - 169.254.169.254/32
