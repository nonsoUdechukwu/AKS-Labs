# S04: no requests/limits. Warn -> warning, Enforce -> MUTATED to 500m CPU / 2048Mi memory (check the bill!).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nores
  namespace: lab-apps
  labels:
    app: nores
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nores
  template:
    metadata:
      labels:
        app: nores
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: nores
      containers:
      - name: web
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args:
        - netexec
        - --http-port=8080
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
