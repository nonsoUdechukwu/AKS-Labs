# S03: no readiness/liveness probes. Warn -> warning, Enforce -> denied.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noprobes
  namespace: lab-apps
  labels:
    app: noprobes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: noprobes
  template:
    metadata:
      labels:
        app: noprobes
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: noprobes
      containers:
      - name: web
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args:
        - netexec
        - --http-port=8080
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
