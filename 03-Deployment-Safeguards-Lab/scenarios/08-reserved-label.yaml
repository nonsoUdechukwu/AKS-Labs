# S08: the label key kubernetes.azure.com is reserved for AKS. Warn -> warning, Enforce -> denied.
# The safeguard matches the exact key only: kubernetes.azure.com/<anything> is admitted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reslabel
  namespace: lab-apps
  labels:
    app: reslabel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reslabel
  template:
    metadata:
      labels:
        app: reslabel
        kubernetes.azure.com: payments
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: reslabel
      containers:
      - name: web
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args:
        - netexec
        - --http-port=8080
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
