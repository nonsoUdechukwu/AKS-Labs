# S11: hostNetwork + privileged. Admitted under Privileged PSS; blocked from Baseline upwards.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostnet
  namespace: lab-apps
  labels:
    app: hostnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hostnet
  template:
    metadata:
      labels:
        app: hostnet
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: hostnet
      containers:
      - name: web
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args:
        - netexec
        - --http-port=8080
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
        securityContext:
          privileged: true
      hostNetwork: true
