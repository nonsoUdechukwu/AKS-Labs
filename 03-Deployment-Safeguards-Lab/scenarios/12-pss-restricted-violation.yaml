# S12: runs as root, no seccomp, keeps capabilities. Passes Baseline, blocked under Restricted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rootish
  namespace: lab-apps
  labels:
    app: rootish
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rootish
  template:
    metadata:
      labels:
        app: rootish
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: rootish
      containers:
      - name: web
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args:
        - netexec
        - --http-port=8080
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
