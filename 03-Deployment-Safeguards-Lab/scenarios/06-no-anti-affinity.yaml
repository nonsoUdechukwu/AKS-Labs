# S06: 3 replicas, no podAntiAffinity/topologySpreadConstraints. Warn -> warning, Enforce -> MUTATED (spread added).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noaff
  namespace: lab-apps
  labels:
    app: noaff
spec:
  replicas: 3
  selector:
    matchLabels:
      app: noaff
  template:
    metadata:
      labels:
        app: noaff
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args:
        - netexec
        - --http-port=8080
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
