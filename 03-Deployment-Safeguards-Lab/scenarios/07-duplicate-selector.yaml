# S07: second Service with the same selector AND an overlapping port as 'web' (from S01).
# The safeguard only flags a clash when at least one port/protocol pair overlaps.
# Warn -> warning, Enforce -> denied.
apiVersion: v1
kind: Service
metadata:
  name: web-duplicate
  namespace: lab-apps
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
